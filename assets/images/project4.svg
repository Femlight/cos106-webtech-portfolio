<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#p4Bg)" />

  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 668 0 Q 680 0 680 12 L 680 44 L 0 44 Z" fill="#0c4a6e" />
    
    <circle cx="24" cy="22" r="6" fill="#ef4444" />
    <circle cx="44" cy="22" r="6" fill="#f59e0b" />
    <circle cx="64" cy="22" r="6" fill="#10b981" />

    <text x="90" y="27" font-family="'Segoe UI', sans-serif" font-size="12" fill="#bae6fd">AlgoLens - QuickSort &amp; Binary Search Visualizer</text>

    <!-- Controls -->
    <rect x="30" y="65" width="620" height="45" rx="8" fill="#075985" />
    <rect x="45" y="75" width="80" height="25" rx="5" fill="#38bdf8" />
    <text x="65" y="92" font-family="sans-serif" font-size="11" font-weight="bold" fill="#082f49">▶ Run</text>

    <rect x="140" y="75" width="80" height="25" rx="5" fill="#0284c7" />
    <text x="156" y="92" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">↺ Reset</text>

    <rect x="235" y="75" width="100" height="25" rx="5" fill="#0369a1" />
    <text x="245" y="92" font-family="sans-serif" font-size="11" fill="#e0f2fe">Speed: 1.5x</text>

    <text x="460" y="92" font-family="monospace" font-size="12" fill="#7dd3fc">Time: O(N log N) | Swaps: 42</text>

    <!-- Sorting Bars Visualization -->
    <g transform="translate(50, 140)">
      <!-- Bars with distinct heights and colors to simulate in-place sorting -->
      <rect x="0" y="160" width="22" height="90" rx="4" fill="#38bdf8" />
      <rect x="28" y="120" width="22" height="130" rx="4" fill="#38bdf8" />
      <rect x="56" y="80" width="22" height="170" rx="4" fill="#38bdf8" />
      <rect x="84" y="200" width="22" height="50" rx="4" fill="#38bdf8" />
      <rect x="112" y="50" width="22" height="200" rx="4" fill="#f43f5e" /> <!-- Pivot 1 -->
      <rect x="140" y="110" width="22" height="140" rx="4" fill="#38bdf8" />
      <rect x="168" y="140" width="22" height="110" rx="4" fill="#38bdf8" />
      <rect x="196" y="70" width="22" height="180" rx="4" fill="#38bdf8" />
      <rect x="224" y="30" width="22" height="220" rx="4" fill="#eab308" /> <!-- Comparing -->
      <rect x="252" y="170" width="22" height="80" rx="4" fill="#eab308" /> <!-- Comparing -->
      <rect x="280" y="100" width="22" height="150" rx="4" fill="#38bdf8" />
      <rect x="308" y="150" width="22" height="100" rx="4" fill="#38bdf8" />
      <rect x="336" y="60" width="22" height="190" rx="4" fill="#38bdf8" />
      <rect x="364" y="130" width="22" height="120" rx="4" fill="#38bdf8" />
      <rect x="392" y="90" width="22" height="160" rx="4" fill="#38bdf8" />
      <rect x="420" y="40" width="22" height="210" rx="4" fill="#10b981" /> <!-- Sorted -->
      <rect x="448" y="35" width="22" height="215" rx="4" fill="#10b981" /> <!-- Sorted -->
      <rect x="476" y="20" width="22" height="230" rx="4" fill="#10b981" /> <!-- Sorted -->
      <rect x="504" y="15" width="22" height="235" rx="4" fill="#10b981" /> <!-- Sorted -->
      <rect x="532" y="5" width="22" height="245" rx="4" fill="#10b981" /> <!-- Sorted -->
      <rect x="560" y="0" width="22" height="250" rx="4" fill="#10b981" /> <!-- Sorted -->
    </g>
