<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#p1Bg)" />

  <!-- Grid lines background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Browser Window Mockup -->
  <g transform="translate(60, 40)" filter="url(#pShadow)">
    <!-- Browser Top Bar -->
    <rect width="680" height="420" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 668 0 Q 680 0 680 12 L 680 44 L 0 44 Z" fill="#1e293b" />
    
    <!-- Window controls -->
    <circle cx="24" cy="22" r="6" fill="#ef4444" />
    <circle cx="44" cy="22" r="6" fill="#f59e0b" />
    <circle cx="64" cy="22" r="6" fill="#10b981" />

    <!-- Address bar -->
    <rect x="90" y="10" width="500" height="24" rx="6" fill="#0f172a" />
    <text x="110" y="26" font-family="monospace" font-size="11" fill="#94a3b8">https://campusconnect.edu/portal/dashboard</text>

    <!-- App Inner UI -->
    <!-- Sidebar -->
    <rect x="0" y="44" width="160" height="376" fill="#1e293b" />
    <circle cx="35" cy="80" r="14" fill="#6366f1" />
    <rect x="60" y="73" width="75" height="14" rx="4" fill="#e2e8f0" />
    <rect x="25" y="120" width="110" height="12" rx="3" fill="#64748b" />
    <rect x="25" y="150" width="95" height="12" rx="3" fill="#64748b" />
    <rect x="25" y="180" width="105" height="12" rx="3" fill="#64748b" />
    <rect x="25" y="210" width="85" height="12" rx="3" fill="#64748b" />

    <!-- Main Content Area -->
    <rect x="180" y="65" width="200" height="20" rx="4" fill="#ffffff" />
    <rect x="180" y="95" width="300" height="10" rx="3" fill="#64748b" />

    <!-- Dashboard Metric Cards -->
    <rect x="180" y="125" width="145" height="85" rx="8" fill="url(#cardGrad)" />
    <text x="195" y="155" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e0e7ff">Enrolled Courses</text>
    <text x="195" y="190" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#ffffff">6 Units</text>

    <rect x="345" y="125" width="145" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="360" y="155" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Current GPA</text>
    <text x="360" y="190" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#10b981">4.82</text>

    <rect x="510" y="125" width="145" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="525" y="155" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Tasks Due</text>
    <text x="525" y="190" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#f59e0b">3 Left</text>

    <!-- Schedule Table Preview -->
    <rect x="180" y="230" width="475" height="160" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="195" y="245" width="120" height="12" rx="3" fill="#cbd5e1" />
    <line x1="180" y1="270" x2="655" y2="270" stroke="#334155" />
    
    <!-- Table Rows -->
    <rect x="195" y="285" width="90" height="10" rx="3" fill="#818cf8" />
    <rect x="330" y="285" width="120" height="10" rx="3" fill="#94a3b8" />
    <rect x="520" y="280" width="60" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
    <text x="532" y="293" font-family="sans-serif" font-size="9" fill="#34d399">Active</text>

    <line x1="180" y1="310" x2="655" y2="310" stroke="#334155" stroke-opacity="0.5" />
    <rect x="195" y="325" width="110" height="10" rx="3" fill="#818cf8" />
    <rect x="330" y="325" width="140" height="10" rx="3" fill="#94a3b8" />
    <rect x="520" y="320" width="60" height="18" rx="9" fill="#3b82f6" fill-opacity="0.2" />
    <text x="529" y="333" font-family="sans-serif" font-size="9" fill="#60a5fa">Lecture</text>

    <line x1="180" y1="350" x2="655" y2="350" stroke="#334155" stroke-opacity="0.5" />
    <rect x="195" y="365" width="80" height="10" rx="3" fill="#818cf8" />
    <rect x="330" y="365" width="100" height="10" rx="3" fill="#94a3b8" />
    <rect x="520" y="360" width="60" height="18" rx="9" fill="#f59e0b" fill-opacity="0.2" />
    <text x="536" y="373" font-family="sans-serif" font-size="9" fill="#fbbf24">Lab</text>
  </g>
</svg>
