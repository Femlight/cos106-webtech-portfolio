<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#vpGrad)" />
  
  <!-- Subtle decorative code lines -->
  <g opacity="0.15" fill="#94a3b8" font-family="monospace" font-size="14">
    <text x="40" y="60">&lt;!DOCTYPE html&gt;</text>
    <text x="40" y="90">&lt;html lang="en"&gt;</text>
    <text x="60" y="120">&lt;head&gt;&lt;title&gt;COS 106 Project Demo&lt;/title&gt;&lt;/head&gt;</text>
    <text x="60" y="150">&lt;body&gt;&lt;script src="js/planner.js"&gt;&lt;/script&gt;&lt;/body&gt;</text>
    <text x="40" y="180">&lt;/html&gt;</text>
  </g>

  <!-- Centered Play Button -->
  <g transform="translate(400, 210)">
    <circle cx="0" cy="0" r="55" fill="#2563eb" filter="url(#glow)" />
    <circle cx="0" cy="0" r="62" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 6" />
    <polygon points="-12,-22 24,0 -12,22" fill="#ffffff" />
  </g>

  <!-- Video Title & Badge -->
  <text x="400" y="315" font-family="'Segoe UI', -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">COS 106 Academic Portfolio &amp; Planner Walkthrough</text>
  <text x="400" y="345" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">Click to Play Interactive Showcase (Audio &amp; Video Demo)</text>
</svg>
