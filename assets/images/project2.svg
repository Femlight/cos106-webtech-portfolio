<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="odsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Phone Gradient -->
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="odsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#odsBg)" />

  <!-- Subtle Decorative Grid Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Glowing background blobs -->
  <circle cx="220" cy="240" r="160" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="620" cy="180" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- ==================== LEFT: MOBILE APP DEVICE MOCKUP ==================== -->
  <g transform="translate(65, 30)" filter="url(#odsShadow)">
    <!-- Outer Phone Chassis -->
    <rect width="250" height="440" rx="36" fill="#090d16" stroke="#334155" stroke-width="3" />
    <!-- Inner Screen Area -->
    <rect x="8" y="8" width="234" height="424" rx="28" fill="#0f172a" />

    <!-- Speaker Island / Dynamic Notch -->
    <rect x="75" y="16" width="100" height="18" rx="9" fill="#020617" />
    <circle cx="155" cy="25" r="4" fill="#1e293b" />
    <circle cx="95" cy="25" r="3" fill="#10b981" opacity="0.8" />

    <!-- App Top Bar -->
    <g transform="translate(16, 44)">
      <!-- ODS Logo Mark -->
      <rect width="30" height="30" rx="8" fill="url(#accentGrad)" />
      <text x="8" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#ffffff">O</text>
      <text x="38" y="15" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Ogun Digital</text>
      <text x="38" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#10b981">SUMMIT APP</text>
      <!-- Notification Icon -->
      <circle cx="196" cy="15" r="12" fill="#1e293b" />
      <circle cx="196" cy="14" r="5" fill="#38bdf8" />
      <circle cx="201" cy="9" r="3" fill="#ef4444" />
    </g>

    <!-- Summit Hero Event Card in App -->
    <g transform="translate(18, 86)">
      <rect width="214" height="96" rx="14" fill="url(#cardBg)" stroke="#475569" stroke-width="0.8" />
      <rect x="10" y="10" width="60" height="18" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="16" y="22" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#34d399">ANNUAL SUMMIT</text>
      <text x="10" y="44" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Ogun Digital Summit</text>
      <text x="10" y="58" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">Theme: Expanding Frontiers &amp; Tech</text>
      <rect x="10" y="68" width="194" height="20" rx="6" fill="url(#accentGrad)" />
      <text x="50" y="82" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Registered Delegate Pass</text>
    </g>

    <!-- Quick Action Icons -->
    <g transform="translate(18, 194)">
      <!-- Schedule -->
      <rect x="0" y="0" width="46" height="46" rx="10" fill="#1e293b" />
      <text x="14" y="22" font-size="15">📅</text>
      <text x="5" y="38" font-family="'Segoe UI', sans-serif" font-size="8" fill="#cbd5e1" font-weight="600">Schedule</text>
      <!-- Speakers -->
      <rect x="56" y="0" width="46" height="46" rx="10" fill="#1e293b" />
      <text x="70" y="22" font-size="15">🎙️</text>
      <text x="60" y="38" font-family="'Segoe UI', sans-serif" font-size="8" fill="#cbd5e1" font-weight="600">Speakers</text>
      <!-- Badge / QR -->
      <rect x="112" y="0" width="46" height="46" rx="10" fill="#1e293b" />
      <text x="126" y="22" font-size="15">🎟️</text>
      <text x="120" y="38" font-family="'Segoe UI', sans-serif" font-size="8" fill="#cbd5e1" font-weight="600">Badge</text>
      <!-- Venue -->
      <rect x="168" y="0" width="46" height="46" rx="10" fill="#1e293b" />
      <text x="182" y="22" font-size="15">📍</text>
      <text x="175" y="38" font-family="'Segoe UI', sans-serif" font-size="8" fill="#cbd5e1" font-weight="600">Venue</text>
    </g>

    <!-- Live Session Card -->
    <g transform="translate(18, 252)">
      <rect width="214" height="72" rx="12" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <circle cx="20" cy="22" r="5" fill="#ef4444" />
      <text x="32" y="25" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#f87171">LIVE MAIN STAGE</text>
      <text x="12" y="44" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Keynote: Future of African Tech</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">June 12 Cultural Centre • 2,400 Live</text>
    </g>

    <!-- Upcoming Workshop Card -->
    <g transform="translate(18, 332)">
      <rect width="214" height="52" rx="12" fill="#162032" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" fill="#e2e8f0">Web3 &amp; Mobile Architecture Lab</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Hall B &#8226; 02:00 PM &#8226; Interactive Session</text>
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(10, 394)">
      <rect width="230" height="30" rx="15" fill="#090d16" />
      <circle cx="35" cy="15" r="4" fill="#10b981" />
      <circle cx="85" cy="15" r="4" fill="#64748b" />
      <circle cx="140" cy="15" r="4" fill="#64748b" />
      <circle cx="195" cy="15" r="4" fill="#64748b" />
    </g>
  </g>

  <!-- ==================== RIGHT: SUMMIT ECOSYSTEM & APP BADGE ==================== -->
  <g transform="translate(360, 45)" filter="url(#odsShadow)">
    <!-- Main Dashboard Card -->
    <rect width="380" height="410" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Header Banner -->
    <path d="M 0 16 Q 0 0 16 0 L 364 0 Q 380 0 380 16 L 380 72 L 0 72 Z" fill="#1e293b" />
    
    <!-- Title and Subtitle -->
    <text x="24" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Ogun Digital Summit (ODS)</text>
    <text x="24" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">Official Event &amp; Community Companion App</text>
    
    <!-- Google Play Store Verified Badge -->
    <g transform="translate(260, 18)">
      <rect width="102" height="34" rx="8" fill="#020617" stroke="#10b981" stroke-width="1.2" />
      <text x="12" y="16" font-family="'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">GET IT ON</text>
      <text x="12" y="27" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">Google Play</text>
    </g>

    <!-- Summit Impact Metrics Grid -->
    <g transform="translate(24, 88)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="102" height="66" rx="10" fill="#1e293b" />
      <text x="12" y="28" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#10b981">6,000+</text>
      <text x="12" y="48" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Delegates &amp; Attendees</text>

      <!-- Metric 2 -->
      <rect x="114" y="0" width="102" height="66" rx="10" fill="#1e293b" />
      <text x="126" y="28" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#38bdf8">5+ Yrs</text>
      <text x="126" y="48" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Lead Tech Leadership</text>

      <!-- Metric 3 -->
      <rect x="228" y="0" width="102" height="66" rx="10" fill="#1e293b" />
      <text x="240" y="28" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#f59e0b">4.8 ★</text>
      <text x="240" y="48" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Play Store Rating</text>
    </g>

    <!-- App Features Highlights -->
    <g transform="translate(24, 172)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Engineering &amp; Core Architecture Highlights</text>

      <!-- Feature 1 -->
      <g transform="translate(0, 16)">
        <circle cx="8" cy="8" r="4" fill="#10b981" />
        <text x="20" y="12" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
          <tspan font-weight="bold" fill="#ffffff">Live Schedule &amp; Calendar Sync:</tspan> Real-time track updates
        </text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(0, 42)">
        <circle cx="8" cy="8" r="4" fill="#38bdf8" />
        <text x="20" y="12" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
          <tspan font-weight="bold" fill="#ffffff">Attendee QR Verification:</tspan> Fast badge check-in at venue
        </text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 68)">
        <circle cx="8" cy="8" r="4" fill="#a855f7" />
        <text x="20" y="12" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
          <tspan font-weight="bold" fill="#ffffff">Push Notifications:</tspan> Instant room changes &amp; stage alerts
        </text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(0, 94)">
        <circle cx="8" cy="8" r="4" fill="#f59e0b" />
        <text x="20" y="12" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
          <tspan font-weight="bold" fill="#ffffff">App ID:</tspan> com.ods.ogun_digital_summit
        </text>
      </g>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(24, 320)">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="14" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">Flutter</text>

      <rect x="84" y="0" width="66" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="96" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#34d399">Dart</text>

      <rect x="158" y="0" width="86" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="168" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#a78bfa">Play Store</text>

      <rect x="252" y="0" width="80" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="262" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#f472b6">REST APIs</text>
    </g>

    <!-- Bottom verification stamp -->
    <g transform="translate(24, 360)">
      <rect width="332" height="34" rx="8" fill="#13271f" stroke="#059669" stroke-width="1" />
      <text x="16" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34d399">
        ✓ Production Mobile App Published on Google Play Store
      </text>
    </g>
  </g>
</svg>