<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle with Gradient -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Subtle concentric decorative rings -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Student Body / Blazer -->
  <g id="body">
    <path d="M 120 460 C 130 350, 180 320, 250 320 C 320 320, 370 350, 380 460 Z" fill="url(#suitGrad)" />
    <!-- White shirt inner collar -->
    <polygon points="215,320 285,320 250,390" fill="#f8fafc" />
    <!-- Blue necktie -->
    <polygon points="243,330 257,330 254,420 246,420" fill="#2563eb" />
    <polygon points="243,322 257,322 255,335 245,335" fill="#1d4ed8" />
    <!-- Lapels -->
    <path d="M 195 320 L 235 390 L 220 450 L 170 370 Z" fill="#1e293b" />
    <path d="M 305 320 L 265 390 L 280 450 L 330 370 Z" fill="#1e293b" />
  </g>

  <!-- Neck -->
  <rect x="225" y="245" width="50" height="85" rx="10" fill="#e28743" />
  <!-- Neck shadow -->
  <path d="M 225 285 Q 250 305 275 285 L 275 320 L 225 320 Z" fill="#b45309" opacity="0.25" />

  <!-- Head / Face -->
  <ellipse cx="250" cy="200" rx="72" ry="85" fill="#f6ad55" />

  <!-- Hair -->
  <path d="M 175 190 C 175 120, 210 100, 250 100 C 290 100, 325 120, 325 190 C 325 170, 310 135, 250 135 C 190 135, 175 170, 175 190 Z" fill="#1c1917" />
  <!-- Stylish modern hair fringe -->
  <path d="M 175 175 Q 210 120 270 125 Q 310 120 325 165 C 310 140 270 140 240 148 C 210 155 190 170 175 175 Z" fill="#292524" />

  <!-- Ears -->
  <ellipse cx="178" cy="205" rx="10" ry="16" fill="#f6ad55" />
  <ellipse cx="322" cy="205" rx="10" ry="16" fill="#f6ad55" />

  <!-- Glasses Frames -->
  <g id="glasses" stroke="#0f172a" stroke-width="4.5" fill="none">
    <!-- Left rim -->
    <rect x="195" y="180" width="44" height="34" rx="8" fill="#ffffff" fill-opacity="0.25" />
    <!-- Right rim -->
    <rect x="261" y="180" width="44" height="34" rx="8" fill="#ffffff" fill-opacity="0.25" />
    <!-- Bridge -->
    <path d="M 239 193 Q 250 188 261 193" />
    <!-- Temples -->
    <line x1="195" y1="192" x2="180" y2="190" />
    <line x1="305" y1="192" x2="320" y2="190" />
  </g>

  <!-- Eyes behind glasses -->
  <circle cx="217" cy="197" r="4.5" fill="#1c1917" />
  <circle cx="283" cy="197" r="4.5" fill="#1c1917" />
  <circle cx="218.5" cy="195.5" r="1.5" fill="#ffffff" />
  <circle cx="284.5" cy="195.5" r="1.5" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M 200 172 Q 217 165 234 172" stroke="#1c1917" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 266 172 Q 283 165 300 172" stroke="#1c1917" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M 250 198 L 247 222 L 254 222" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Smile -->
  <path d="M 232 242 Q 250 258 268 242" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Floating Academic / Tech Badges -->
  <g transform="translate(350, 80)" filter="url(#softShadow)">
    <circle cx="30" cy="30" r="30" fill="#3b82f6" />
    <text x="30" y="37" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <g transform="translate(60, 100)" filter="url(#softShadow)">
    <circle cx="25" cy="25" r="25" fill="#10b981" />
    <!-- Graduation Cap Icon -->
    <path d="M 12 25 L 25 18 L 38 25 L 25 32 Z" fill="#ffffff" />
    <path d="M 18 28.5 L 18 33 Q 25 37 32 33 L 32 28.5" stroke="#ffffff" stroke-width="2" fill="none" />
    <line x1="34" y1="26" x2="36" y2="34" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
